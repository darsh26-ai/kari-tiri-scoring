<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Kari Ni Tiri - Score Keeper</title>

<style>

/* =========================
   RESET - SAFARI SAFE
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


:root{

    --primary:#4f46e5;
    --success:#22c55e;
    --danger:#ef4444;

    --glass:rgba(255,255,255,.16);

    --shadow:
    0 20px 50px rgba(0,0,0,.25);

}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    padding:25px;

    background:
    linear-gradient(
        -45deg,
        #667eea,
        #764ba2,
        #43cea2,
        #185a9d
    );

    background-size:400% 400%;

    animation:bgMove 15s infinite;

    -webkit-tap-highlight-color:transparent;

}



@keyframes bgMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}



/* =========================
   MAIN CONTAINER
========================= */


.container{

    max-width:1500px;

    margin:auto;

    padding:30px;

    border-radius:30px;

    background:
    rgba(255,255,255,.12);


    /* Safari support */
    -webkit-backdrop-filter:blur(20px);

    backdrop-filter:blur(20px);


    box-shadow:var(--shadow);

}



/* =========================
   TITLE
========================= */


.title{

    text-align:center;

    color:white;

    margin-bottom:35px;

}



.title h1{

    font-size:45px;

    font-weight:700;

}



.title p{

    opacity:.85;

    margin-top:8px;

}



/* =========================
   CARD
========================= */


.card{

    background:var(--glass);

    color:white;

    padding:22px;

    border-radius:20px;

    box-shadow:var(--shadow);

}



.card h3{

    margin-bottom:15px;

}



label{

    display:block;

    font-weight:600;

    margin-bottom:10px;

}



/* =========================
   INPUT + SELECT
   SAFARI FIX
========================= */


select,
input{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    outline:none;

    font-size:15px;

    background:white;

    color:#222;

    -webkit-appearance:none;

    appearance:none;

}



/* =========================
   GAME INFO
========================= */


.game-info{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:20px;

    margin-bottom:25px;

}

.red-card{
    color:red;
    font-weight:bold;
}

.black-card{
    color:black;
    font-weight:bold;
}

.red-card-selected {
    color:red !important;
    font-weight:bold;
}

.black-card-selected {
    color:black !important;
    font-weight:bold;
}

/* =========================
   PARTNER AREA
========================= */


.partner-section{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));

    gap:20px;

    margin-bottom:25px;

}

.partner-card-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    margin-bottom: 10px;
}

.partner-card-row select {
    width: 100%;
    height: 36px;
    min-height: 36px;
    padding: 6px 10px;

    border-radius: 8px;
    border: 1px solid #ccc;

    font-size: 15px;
    line-height: 24px;

    background: white;
    color: #222;

    box-sizing: border-box;
}


/* =========================
   PLAYER CONTROL
========================= */


.player-panel{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

    margin:25px 0;

}



.player-panel input{

    flex:1;

    min-width:250px;

}



/* =========================
   BUTTONS
========================= */


button{

    border:none;

    border-radius:12px;

    padding:13px 22px;

    cursor:pointer;

    color:white;

    font-weight:600;

    transition:.3s;


    /* Safari touch fix */
    touch-action:manipulation;

}



button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 20px rgba(0,0,0,.25);

}



.add{

    background:var(--success);

}


.round{

    background:var(--primary);

}


.reset{

    background:var(--danger);

}
 
/* =========================
   STATISTICS
========================= */


.stats{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

    margin-bottom:30px;

}



.stat-card{

    background:
    rgba(255,255,255,.18);

    color:white;

    padding:25px;

    text-align:center;

    border-radius:20px;

    box-shadow:var(--shadow);

}



.stat-card span{

    display:block;

    margin-top:10px;

    font-size:35px;

    font-weight:bold;

}



/* =========================
   DASHBOARD
========================= */


.dashboard{

    display:grid;

    grid-template-columns:
    2.5fr 1fr;

    gap:25px;

}



.table-card{

    background:white;

    border-radius:20px;

    overflow-x:auto;

    -webkit-overflow-scrolling:touch;

}



table{

    width:100%;

    border-collapse:collapse;

}



thead{

    background:#23374d;

    color:white;

}



th{

    padding:15px;

}



td{

    padding:12px;

    text-align:center;

    border-bottom:1px solid #ddd;

}



tbody tr:nth-child(even){

    background:#f7f9fc;

}



tfoot{

    background:#edf2f7;

    font-weight:bold;

}



.score-input{

    width:80px;
    min-width:80px;
    padding:8px;
    text-align:center;
    font-size:18px;

    -webkit-appearance:none;
    appearance:none;

}



/* =========================
   LEADER
========================= */


.leader{

    min-height:280px;

    border-radius:20px;

    background:
    linear-gradient(
        135deg,
        #43cea2,
        #185a9d
    );

    color:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:30px;

}



.badge{

    margin-top:20px;

    background:gold;

    color:#222;

    padding:15px 30px;

    border-radius:40px;

    font-size:22px;

    font-weight:bold;

}

#remainingUnderLeader .rank-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 10px;
  margin-top: 4px;
  font-size: 14px;
  color: white;
}


/* =========================
   EDIT BUTTON
========================= */

.edit-btn {
    margin-top:8px;

    padding:5px 12px;

    background:#d3d3d3;

    border-radius:8px;

    font-size:12px;
}

/* =========================
   REMOVE BUTTON
========================= */


.remove-btn{

    margin-top:8px;

    padding:5px 12px;

    background:#ef4444;

    border-radius:8px;

    font-size:12px;

}



.remove-btn:hover{

    background:#b91c1c;

}



/* =========================
   MOBILE
========================= */


@media(max-width:900px){


.dashboard{

    grid-template-columns:1fr;

}


}



@media(max-width:600px){


body{

    padding:10px;

}


.container{

    padding:15px;

}


.title h1{

    font-size:30px;

}


.player-panel{

    flex-direction:column;

}


button{

    width:100%;

}


}

.card-position{

margin-bottom:10px;

}

.red {
    color: red;
}

.black {
    color: black;
}

.ranking-list {
  margin-top: 20px;
  padding: 10px 0;
  border-radius: 12px;
}

.rank-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, #ffffff20, #ffffff05);
  padding: 12px 16px;
  margin: 6px 0;
  border-radius: 10px;
  backdrop-filter: blur(6px);
  color: #fff;
  font-size: 16px;
}

.rank-number {
  font-weight: bold;
  color: black;
}

.rank-name {
  flex: 1;
  margin-left: 10px;
  color: white !important;
}

.rank-points {
  font-weight: bold;
  color: black;
}

/* =========================
   DISABLED RESULT BUTTON
========================= */

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
}

.result-locked {
    opacity: 0.45;
    cursor: not-allowed;
}

/* Disabled game selections */

select:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    background: #d9d9d9;
    color: #777;
}

.round-selection-locked {
    opacity: 0.45;
    pointer-events: none;
}

</style>

</head>


<body>


<div class="container">


<header class="title">

<h1>
🃏 ♠ 3
</h1>

<p>
Scoring
</p>

</header>



<!-- =========================
     GAME SETTINGS
========================= -->


<section class="game-info">


<div class="card">

<label>
👤 Highest Bidder
</label>


<select id="highestBidder">

<option value="">
Select Player
</option>


</select>


</div>




<div class="card">


<label>
🎯 Bid Points
</label>


<select id="bidPoints">

</select>


</div>



<div class="card">

<label>Wild Card </label>

<select id="wildSuit" onchange="this.style.color=this.options[this.selectedIndex].dataset.color">
    <option data-color="black" style="color:black">♠ Spades</option>
    <option data-color="red" style="color:red">♥ Hearts</option>
    <option data-color="red" style="color:red">♦ Diamonds</option>
    <option data-color="black" style="color:black">♣ Clubs</option>
</select>

</div>


</section>




<!-- =========================
     PARTNERS
========================= -->


<section class="partner-section">


<div class="card">


<h3>
🃏 Partner Cards
</h3>


<div id="partnerCardsContainer">

</div>


</div>





<div class="card">


<h3>
🤝 Partners
</h3>


<div id="partnerNamesContainer">

</div>


</div>



</section>





<!-- =========================
     PLAYER BUTTONS
========================= -->


<section class="player-panel">


<input 
id="playerName"
placeholder="Enter Player Name"
>



<button class="add">

➕ Add Player

</button>



<button class="round">

🎲 Add Round

</button>


<button class="round" id="bidWin">

🏆 Bidder Won

</button>


<button class="round" id="bidLose">

❌ Bidder Lost

</button>

<button class="round" id="undoRound">
↩️ Undo Last Round
</button>


<button class="reset" id="resetGame">

🧹 Reset

</button>


</section>





<!-- =========================
     STATISTICS
========================= -->


<section class="stats">


<div class="stat-card">

<h4>
Players
</h4>

<span id="playerCount">
0
</span>

</div>




<div class="stat-card">

<h4>
Rounds
</h4>

<span id="roundCount">
0
</span>

</div>





<div class="stat-card">

<h4>
Highest Score
</h4>

<span id="highestScore">
0
</span>

</div>



</section>





<!-- =========================
     SCORE DASHBOARD
========================= -->


<section class="dashboard">



<div class="table-card">


<table>


<thead>


<tr id="headerRow">


<th>
Round
</th>


</tr>


</thead>



<tbody id="scoreBody">

</tbody>




<tfoot>


<tr id="totalRow">


<td>
Total
</td>


</tr>


</tfoot>



</table>



</div>





<aside class="leader">


<h2>
🏆 Current Leader
</h2>



<div class="badge">

No Scores Yet

</div>

<div id="remainingUnderLeader"></div>



</aside>



</section>



</div>
<script>

/********************************************
 GLOBAL DATA
********************************************/

let players = [];

let rounds = [];

let roundCount = 0;

let currentRound = null;

/* Prevent Bidder Won/Lost from being used twice */
let roundLocked = true;
	
const playerColors = [

"#3498db",
"#2ecc71",
"#9b59b6",
"#f39c12",
"#e74c3c",
"#16a085",
"#d35400",
"#34495e"

];



/********************************************
 APP START
********************************************/


document.addEventListener(
"DOMContentLoaded",
function(){

    populateBidPoints();


    document
    .querySelector(".add")
    .addEventListener(
        "click",
        addPlayer
    );


    document
    .querySelector(".round")
    .addEventListener(
        "click",
        addRound
    );


	document
	.getElementById("bidWin")
	.addEventListener(
	"click",
	function(){
	
	    if(roundLocked){
	
	        return;
	
	    }
	
	    applyResult("WIN");
	
	});
	
	
	document
	.getElementById("bidLose")
	.addEventListener(
	"click",
	function(){
	
	    if(roundLocked){
	
	        return;
	
	    }
	
	    applyResult("LOSE");
	
	});

    document
    .querySelector(".reset")
    .addEventListener(
        "click",
        resetGame
    );


    createPartnerCardSelectors();

	createPartnerNameSelectors();
	
	/* No active round when application starts */
	setResultButtonsEnabled(false);

	/* Lock all round selections */
	setRoundInputsEnabled(false);


});

/********************************************
 Undo Button
********************************************/

document.getElementById("undoRound").addEventListener("click", undoLastRound);

function undoLastRound() {

    // Ask for password
    const password = prompt(
        "Enter password to undo last round:"
    );

    if (password === null) {
        return;
    }

    if (password !== "Innocent mistake") {
        alert("❌ Incorrect password!");
        return;
    }

    if (rounds.length === 0) {
        alert("No rounds to undo");
        return;
    }

    // Remove the last completed round
    const removed = rounds.pop();

    // IMPORTANT:
    // The next round should reuse the removed game number
    roundCount = rounds.length;

    // Restore the removed round as the active round
    currentRound = {
        number: removed.number,
        bidder: removed.bidder || "",
        bid: removed.bid || 275,
        partners: removed.partners || [],
        result: ""
    };

    // Rebuild the score table
    restoreRounds();

    // Add the undone round back as an editable row
    const tbody =
        document.getElementById("scoreBody");

    const row =
        document.createElement("tr");

    row.dataset.round =
        currentRound.number;

    row.innerHTML = `
        <td>
            Game ${currentRound.number}
        </td>
    `;

    players.forEach(function(player){

        row.insertAdjacentHTML(
            "beforeend",

            `
            <td>
                <input
                    type="number"
                    class="score-input"
                    value="0"
                    data-player="${player.name}"
                    readonly
                >
            </td>
            `
        );

    });

    tbody.appendChild(row);


    // Restore bidder
    document.getElementById(
        "highestBidder"
    ).value =
        currentRound.bidder;


    // Restore bid
    document.getElementById(
        "bidPoints"
    ).value =
        currentRound.bid;


    // Restore partners
    document.querySelectorAll(
        ".partner-name"
    ).forEach(function(select){

        select.value = "";

    });

    (currentRound.partners || []).forEach(
        function(partner, index){

            const select =
                document.querySelectorAll(
                    ".partner-name"
                )[index];

            if(select){
                select.value = partner;
            }

        }
    );


    // Enable round selections again
    setRoundInputsEnabled(true);

    // Enable Win / Loss
    setResultButtonsEnabled(true);


    // Update totals
    calculateTotals();

    // Update statistics
    updateStatistics();

    // Save state
    saveGame();


    alert(
        "↩️ Game " +
        removed.number +
        " has been undone.\n\n" +
        "You can enter the result again."
    );
}


/********************************************
 BID POINTS
Safari Fix
********************************************/


function populateBidPoints(){


const bid =
document.getElementById(
"bidPoints"
);



for(
let i=275;
i<=500;
i+=5
){


bid.insertAdjacentHTML(

"beforeend",

`
<option value="${i}">
${i}
</option>
`

);


}


}





/********************************************
 PLAYER MANAGEMENT
********************************************/


function addPlayer(){


let input =
document.getElementById(
"playerName"
);



let name =
input.value.trim();



if(!name){


alert(
"Enter player name"
);


return;

}




if(
players.some(
function(p){

return p.name.toLowerCase()
===
name.toLowerCase();

}

)

){


alert(
"Player already exists"
);


return;

}




players.push({

name:name,

color:
playerColors[
players.length %
playerColors.length
]


});



input.value="";



refreshPlayerUI();

restoreRounds();


}





function removePlayer(name){


if(
!confirm(
"Remove " + name + "?"
)

){

return;

}



players =
players.filter(

function(p){

return p.name !== name;

}

);



refreshPlayerUI();


}





function refreshPlayerUI(){


buildTableHeader();

buildTotalRow();

updateBidderDropdown();

updateStatistics();

refreshPartnerDropdowns();


}







/********************************************
 PLAYER TABLE HEADER
Safari Safe Remove Button
********************************************/


function buildTableHeader(){


const header =
document.getElementById(
"headerRow"
);



header.innerHTML =

`
<th>
Round
</th>
`;



players.forEach(

function(player){


header.insertAdjacentHTML(

"beforeend",

`

<th style="
background:${player.color}
">

${player.name}


<br>


<button class="edit-btn" data-player="${player.name}">
✎ Edit
</button>

<button class="remove-btn" data-player="${player.name}">
✖ Remove
</button>



</th>


`

);


});


}





/********************************************
 SAFARI CLICK HANDLER
********************************************/
document.addEventListener("click", function(event) {

    if (event.target.classList.contains("edit-btn")) {
        editPlayerName(event.target.dataset.player);
    }

});


document.addEventListener(

"click",

function(event){


if(
event.target.classList.contains(
"remove-btn"
)

){


removePlayer(
event.target.dataset.player
);


}


}

);


/********************************************
 Edit player name
********************************************/

function editPlayerName(oldName) {

    const newName = prompt("Enter new name for " + oldName + ":").trim();

    if (!newName) {
        alert("Name cannot be empty");
        return;
    }

    if (players.some(p => p.name.toLowerCase() === newName.toLowerCase())) {
        alert("A player with this name already exists");
        return;
    }

    // Update player list
    players = players.map(p => {
        if (p.name === oldName) {
            return { ...p, name: newName };
        }
        return p;
    });

    // Update totals row IDs
    const totalCell = document.getElementById("total-" + oldName);
    if (totalCell) {
        totalCell.id = "total-" + newName;
    }

    // Update score inputs in all rounds
    document.querySelectorAll(`input[data-player="${oldName}"]`)
        .forEach(input => {
            input.dataset.player = newName;
        });

    // Update rounds data structure
    rounds.forEach(r => {
        if (r.scores[oldName] !== undefined) {
            r.scores[newName] = r.scores[oldName];
            delete r.scores[oldName];
        }
    });

    // Update partners list
    partners = partners.map(p => p === oldName ? newName : p);

    // Refresh UI
    refreshPlayerUI();
    restoreRounds();
    calculateTotals();
    saveGame();

    alert("Player name updated successfully.");
}



/********************************************
 TOTAL ROW
********************************************/


function buildTotalRow(){


const row =
document.getElementById(
"totalRow"
);



row.innerHTML =

`

<td>
Total
</td>

`;



players.forEach(

function(player){


row.insertAdjacentHTML(

"beforeend",

`

<td id="total-${player.name}">
0
</td>

`

);


});


}






/********************************************
 BIDDER DROPDOWN
********************************************/


function updateBidderDropdown(){


const box =
document.getElementById(
"highestBidder"
);



box.innerHTML =

`
<option value="">
Select Player
</option>
`;



players.forEach(

function(player){


box.insertAdjacentHTML(

"beforeend",

`

<option value="${player.name}">
${player.name}
</option>

`

);


});


}






/********************************************
 STATISTICS
********************************************/


function updateStatistics(){


document
.getElementById(
"playerCount"
)
.innerHTML =
players.length;



document
.getElementById(
"roundCount"
)
.innerHTML =
roundCount;


}







/********************************************
 ROUND MANAGEMENT
********************************************/


function addRound(){

    /* Prevent creating a second unfinished round */
    if(currentRound){

        alert(
            "⚠️ This round is still waiting for a result.\n\n" +
            "Please select Bidder Won or Bidder Lost first."
        );

        return;
    }


    if(players.length === 0){

        alert("Add players first");
        return;

    }


    roundCount = rounds.length + 1;


    currentRound = {

        number: roundCount,

        bidder: "",

        bid: 0,

        partners: [],

        result: ""

    };


    /* Unlock result buttons for this new round */
    setResultButtonsEnabled(true);

	// Enable all round selections
	setRoundInputsEnabled(true);

    let tbody =
        document.getElementById("scoreBody");


    let row =
        document.createElement("tr");


    row.dataset.round =
        roundCount;


    row.innerHTML =

    `
    <td>
        Game ${roundCount}
    </td>
    `;


    players.forEach(function(player){

        row.insertAdjacentHTML(

            "beforeend",

            `
            <td>

                <input
                    type="number"
                    value="0"
                    class="score-input"
                    data-player="${player.name}"
                    readonly
                >

            </td>
            `

        );

    });


    tbody.appendChild(row);


    /* Reset round selections */

    partners = [];

    partnerCards = [];


    document.getElementById("highestBidder").value = "";


    document.querySelectorAll(".partner-name")
        .forEach(function(select){

            select.value = "";

        });


    document.querySelectorAll(".partner-suit")
        .forEach(function(select){

            select.value = "";

            select.className = "partner-suit";

        });

/********************************************
 SCORE CALCULATION
********************************************/


function calculateTotals(){

    let totals = {};

    players.forEach(function(player){
        totals[player.name] = 0;
    });

    document
    .querySelectorAll(".score-input")
    .forEach(function(input){

        let player = input.dataset.player;

        totals[player] += Number(input.value) || 0;

    });

    players.forEach(function(player){

        let cell = document.getElementById(
            "total-" + player.name
        );

        if(cell){

            cell.innerHTML =
                totals[player.name];

        }

    });

    // Write totals back into each player object
    players.forEach(function(player){

        player.total =
            totals[player.name] || 0;

    });

    updateHighestScore(totals);

    updateLeader(totals);

    // Display ranking under current leader
    updateRemainingUnderLeader();

    // IMPORTANT:
    // Removed updateRemainingRankingUI()
    // because there is no remainingRankingContainer
    // in the HTML.

    saveGame();

}



function updateHighestScore(totals){


let highest=0;



Object.values(totals)
.forEach(

function(score){


if(score>highest){

highest=score;

}


}

);



document
.getElementById(
"highestScore"
)
.innerHTML =
highest;


}






function updateLeader(totals){


let winner="";

let score=-Infinity;



Object.entries(totals)
.forEach(

function(item){


let name=item[0];

let total=item[1];



if(total>score){

score=total;

winner=name;

}


}

);



document
.querySelector(".badge")
.innerHTML =


winner

?

`
🏆 ${winner}

<br>

${score} Points
`

:

"No Scores Yet";


}

let partnerCards=[];

// Current round result

function createPartnerCardSelectors() {

  const container = document.getElementById("partnerCardsContainer");
  container.innerHTML = "";

  const suits = [
    { symbol: "♠", name: "Spade", color: "black" },
    { symbol: "♥", name: "Heart", color: "red" },
    { symbol: "♦", name: "Diamond", color: "red" },
    { symbol: "♣", name: "Club", color: "black" }
  ];

  const ranks = ["A", "K", "Q", "J", "3"];

  for (let i = 1; i <= 4; i++) {

    // horizontal wrapper
    const row = document.createElement("div");
    row.className = "partner-card-row";

    // First / Second selector
    let position = document.createElement("select");
    position.className = "card-position";
    position.innerHTML = `
      <option value="">Select</option>
      <option value="First">First</option>
      <option value="Second">Second</option>
    `;

    // Suit dropdown
    let suitSelect = document.createElement("select");
    suitSelect.className = "partner-suit";
    suitSelect.innerHTML = `
      <option value="">Color</option>
      ${suits.map(s => 
        `<option value="${s.symbol}" style="color:${s.color};">${s.symbol} ${s.name}</option>`
      ).join("")}
    `;

    // Rank dropdown
    let rankSelect = document.createElement("select");
    rankSelect.className = "partner-rank";
    rankSelect.innerHTML = `
      <option value="">Card</option>
      ${ranks.map(r => `<option value="${r}">${r}</option>`).join("")}
    `;

    // Append horizontally
    row.appendChild(position);
    row.appendChild(suitSelect);
    row.appendChild(rankSelect);

    container.appendChild(row);

    // Save on change
    suitSelect.addEventListener("change", savePartnerCards);
    rankSelect.addEventListener("change", savePartnerCards);

    // Color logic for suit dropdown
    suitSelect.addEventListener("change", function () {
      if (suitSelect.value === "♥" || suitSelect.value === "♦") {
        suitSelect.className = "partner-suit red-card-selected";
      } else if (suitSelect.value === "♠" || suitSelect.value === "♣") {
        suitSelect.className = "partner-suit black-card-selected";
      } else {
        suitSelect.className = "partner-suit";
      }
    });
  }
}

function loadGame(){

    let saved = localStorage.getItem("kariNiTiri");

    if(!saved){
        return;
    }

    let data = JSON.parse(saved);


    players = data.players || [];

    rounds = data.rounds || [];

    roundCount = data.roundCount || 0;

    partners = data.partners || [];

    partnerCards = data.partnerCards || [];


    refreshPlayerUI();


    // restore rounds table
    restoreRounds();


    document.getElementById("highestBidder").value =
        data.bidder || "";


    document.getElementById("bidPoints").value =
        data.bid || "275";


    document.getElementById("wildSuit").value =
        data.wild || "♠ Spades";


    calculateTotals();

}

function restoreRounds(){

    let tbody =
    document.getElementById("scoreBody");


    tbody.innerHTML="";


    rounds.forEach(function(round){


        let row=document.createElement("tr");


        row.dataset.round =
        round.number;



        row.innerHTML =
        `
        <td>
        Game ${round.number}
        </td>
        `;



        players.forEach(function(player){


            let score =
            round.scores[player.name] || 0;


            row.insertAdjacentHTML(
            "beforeend",

            <td>

            class="score-input"
            value="${score}"
            data-player="${player.name}"

            `

            );


        });



        tbody.appendChild(row);


    });


    calculateTotals();

}

function applyResult(result){

    /* =========================================
       SAFETY CHECK
    ========================================= */

    if(!currentRound){

        alert(
            "⚠️ No active round.\n\n" +
            "Click Add Round to start a new round."
        );

        return;
    }


    /* =========================================
       PREVENT DOUBLE RESULT
    ========================================= */

    if(roundLocked){

        alert(
            "⚠️ This round has already been completed."
        );

        return;
    }


    /* =========================================
       FINAL VALIDATION
    ========================================= */

    if(!prepareCurrentRound()){

        return;
    }


    /* =========================================
       GET LAST ROUND ROW
    ========================================= */

    let rows =
        document.querySelectorAll(
            "#scoreBody tr"
        );


    let row =
        rows[rows.length - 1];


    if(!row){

        alert("Round row not found.");

        return;
    }


    let inputs =
        row.querySelectorAll(
            ".score-input"
        );


    /* =========================================
       CALCULATE SCORES
    ========================================= */

    inputs.forEach(function(input){

        let player =
            input.dataset.player;


        let score = 0;


        /* =========================
           BIDDER
        ========================= */

        if(player === currentRound.bidder){

            if(result === "WIN"){

                score =
                    currentRound.bid * 2;

            }

            else if(result === "LOSE"){

                score =
                    -currentRound.bid;

            }

        }


        /* =========================
           PARTNERS
        ========================= */

        else if(
            currentRound.partners.includes(player)
        ){

            if(result === "WIN"){

                score =
                    currentRound.bid;

            }

            else if(result === "LOSE"){

                score = 0;

            }

        }


        /* =========================
           NON-PARTNERS
        ========================= */

        else{

            if(result === "LOSE"){

                score =
                    currentRound.bid;

            }

            else if(result === "WIN"){

                score = 0;

            }

        }


        input.value = score;

    });


    /* =========================================
       SAVE RESULT
    ========================================= */

    currentRound.result =
        result;


    let roundData = {

        number:
            currentRound.number,

        bidder:
            currentRound.bidder,

        bid:
            currentRound.bid,

        partners:
            [...currentRound.partners],

        result:
            currentRound.result,

        scores:{}

    };


    inputs.forEach(function(input){

        roundData.scores[
            input.dataset.player
        ] =
            Number(input.value);

    });


    rounds.push(roundData);


    /* =========================================
       IMPORTANT:
       LOCK THIS ROUND
    ========================================= */

    setResultButtonsEnabled(false);


    /* =========================================
       UPDATE UI
    ========================================= */

    calculateTotals();


    row.cells[0].innerHTML =
    result === "WIN" ? "🏆" : "❌";
    `;


    /* =========================================
       CLEAR CURRENT ROUND
       ========================================= */

    currentRound = null;

	// Make sure result buttons stay locked
	setResultButtonsEnabled(false);

	// Lock all selections after round is completed
	setRoundInputsEnabled(false);

    /* =========================================
       CLEAR ROUND SELECTIONS
       ========================================= */

    document.getElementById(
        "highestBidder"
    ).value = "";


    partners = [];

    partnerCards = [];


    document.querySelectorAll(
        ".partner-name"
    ).forEach(function(select){

        select.value = "";

    });


    document.querySelectorAll(
        ".partner-suit"
    ).forEach(function(select){

        select.value = "";

        select.className =
            "partner-suit";

    });


    document.querySelectorAll(
        ".partner-rank"
    ).forEach(function(select){

        select.value = "";

    });


    /* =========================================
       SAVE FINAL STATE
    ========================================= */

    saveGame();


    updateStatistics();


    /* =========================================
       CONFIRMATION
    ========================================= */

    alert(

        result === "WIN"

        ? "🏆 Bidder Won!\n\nRound has been completed and locked."

        : "❌ Bidder Lost!\n\nRound has been completed and locked."

    );

}

function resetGame(){

    const password = prompt("Enter password to reset the game:");

    // User clicked Cancel
    if(password === null){
        return;
    }

    // Check password
    if(password !== "Na maza aavi"){
        alert("❌ Incorrect password!");
        return;
    }

    // Final confirmation
    if(!confirm("Start a new game?")){
        return;
    }

    try{
        localStorage.removeItem("kariNiTiri");
        // or localStorage.clear(); if you want to remove ALL local storage
    }
    catch(e){}

    players = [];
    rounds = [];
    roundCount = 0;
    currentRound = null;
    partners = [];
    partnerCards = [];

    document.getElementById("scoreBody").innerHTML = "";

    document.getElementById("playerName").value = "";
    document.getElementById("highestBidder").innerHTML =
        '<option value="">Select Player</option>';

    buildTableHeader();
    buildTotalRow();
    updateStatistics();

    document.getElementById("highestScore").innerHTML = "0";

    document.querySelector(".badge").innerHTML =
        "No Scores Yet";

    createPartnerCardSelectors();
    createPartnerNameSelectors();

    alert("✅ Game has been reset successfully.");

	setRoundInputsEnabled(false);
	setResultButtonsEnabled(false);
}

    let symbol = document.getElementById("wildSymbol");

    if(suit === "heart"){
        symbol.innerHTML = "♥";
        symbol.className = "red";
    }
    else if(suit === "diamond"){
        symbol.innerHTML = "♦";
        symbol.className = "red";
    }
    else if(suit === "club"){

        symbol.className = "black";
    }
    else {
        symbol.innerHTML = "♠";
        symbol.className = "black";
    }
}

/********************************************
 Remianing after Leader
********************************************/

function getRemainingRanking() {
  let ranking = players.map(player => ({
    name: player.name,
    total: player.total || 0
  }));

  ranking.sort((a, b) => b.total - a.total);

  ranking.shift(); // remove leader

  return ranking;
}

function updateRemainingRankingUI() {

    let ranking = getRemainingRanking();

    const container =
        document.getElementById(
            "remainingRankingContainer"
        );

    // Container does not exist in current HTML.
    // Simply exit without causing an error.
    if(!container){
        return;
    }

    container.innerHTML = "";

    ranking.forEach(function(player, index){

        container.insertAdjacentHTML(
            "beforeend",

            `
            <div class="rank-row">

                <span class="rank-number">
                    ${index + 2}
                </span>

                <span class="rank-name">
                    ${player.name}
                </span>

                <span class="rank-points">
                    ${player.total} pts
                </span>

            </div>
            `

        );

    });

}

function updateRemainingUnderLeader() {
  let ranking = getRemainingRanking();
  const container = document.getElementById("remainingUnderLeader");

  container.innerHTML = "";

  ranking.forEach((player, index) => {
    container.insertAdjacentHTML("beforeend", `
      <div class="rank-row">
        <span class="rank-number">${index + 2}</span>
        <span class="rank-name">${player.name}</span>
        <span class="rank-points">${player.total} pts</span>
      </div>
    `);
  });
}
